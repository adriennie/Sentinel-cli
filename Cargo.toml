[workspace]
members = ["crates/sentinel-cli", "crates/sentinel-core", "crates/sentinel-policy", "crates/sentinel-scanner", "crates/sentinel-audit"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.99.1"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "2", default-features = false, features = ["serialize", "deserialize"] }
thiserror = "2"
globset = "0.4"
tempfile = "3"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
toml = "0.8"
ignore = "0.4"
packageurl = "0.5"
semver = "1"
cvss = "2"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
jsonschema = { version = "0.29", default-features = false }
regex = "1"
